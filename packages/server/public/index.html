<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mogul</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; --gold: #ffd700; --ink: #e8dcc8; --muted: #a89a7f; --faint: #9a8b70; --line: #3c352a; --line-strong: #6b5736; --card: #221d16; --well: #191510; --go: #4caf50; }
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #1a1612; color: var(--ink); margin: 0 auto; padding: 16px;
      max-width: 1280px;
    }
    /* Era tint: an overlay filters everything beneath it. A filter on body would reach every
       descendant, so colour-coded elements (map, studio swatches) sit above the overlay instead. */
    body.era-silent::after, body.era-talkies::after {
      content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }
    body.era-silent::after { backdrop-filter: grayscale(1); -webkit-backdrop-filter: grayscale(1); }
    body.era-talkies::after { backdrop-filter: sepia(0.45); -webkit-backdrop-filter: sepia(0.45); }
    .map, .legend .swatch { position: relative; z-index: 2; }
    header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--gold); }
    h2 { margin: 0 0 10px; font-size: 18px; font-weight: normal; }
    h3 { margin: 14px 0 8px; font-size: 14px; font-weight: normal; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .pill { background: #2b251d; border: 1px solid #4a4032; border-radius: 999px; padding: 2px 12px; font-size: 14px; }
    #views > div { display: none; }
    #views > div.active { display: block; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
    button {
      background: #463a28; color: #f0e6d2; border: 1px solid var(--line-strong);
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; margin: 2px; font-family: inherit;
    }
    button:hover { background: #5a4a30; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #1e5c2e; border-color: var(--go); color: #c8f7d0; }
    button.primary:hover { background: #267338; }
    button.quiet { background: transparent; }
    input { background: #141008; color: var(--ink); border: 1px solid #4a4032; border-radius: 6px; padding: 6px 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
    .money { color: var(--gold); }

    /* --- header: stepper and status --- */
    #stepper { display: flex; gap: 4px; flex-wrap: wrap; }
    .step { padding: 3px 12px; border-radius: 999px; font-size: 14px; color: var(--faint); border: 1px solid transparent; }
    .step.current { color: var(--gold); border-color: var(--gold); background: #ffd70018; }
    #status { margin-left: auto; font-size: 14px; color: var(--muted); }
    #status .you { color: var(--gold); }

    /* --- layout: stage + rail --- */
    #game-layout { display: flex; gap: 12px; align-items: flex-start; }
    #stage { flex: 1 1 auto; min-width: 0; }
    #stage > .card:first-child { margin-top: 0; }
    #rail { width: 280px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    #rail .card { margin: 0; }
    @media (max-width: 1024px) {
      #game-layout { flex-wrap: wrap; }
      #rail { width: 100%; }
      #status { margin-left: 0; width: 100%; }
    }
    .stage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .stage-head h2 { margin: 0; }
    .hint { font-size: 14px; color: var(--muted); }
    .stage-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    /* --- opening night summary --- */
    .summary { border-color: #6b5736; }
    .summary table { border-collapse: collapse; width: 100%; font-size: 14px; }
    .summary td { padding: 3px 8px 3px 0; }
    .summary td.num { text-align: right; }

    /* --- property cards (auction) --- */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .pcard { background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .pcard .pc-name { font-size: 16px; }
    .pcard .pc-meta { font-size: 13px; color: var(--muted); }
    .pcard .pc-price { font-size: 14px; color: var(--gold); margin-top: auto; }
    .pcard.future { opacity: 0.8; border-style: dashed; }
    .pcard.on-block { border-color: var(--gold); }
    .pcard button { margin: 6px 0 0; }

    /* --- on the block --- */
    .block { border: 2px solid var(--gold); border-radius: 8px; padding: 12px; margin-bottom: 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: #ffd7000a; }
    .block .b-prop { flex: 1 1 200px; }
    .block .b-name { font-size: 18px; }
    .block .b-bid { text-align: right; }
    .block .b-bid .amount { font-size: 24px; color: var(--gold); }
    .block .b-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .qty { display: inline-flex; align-items: center; gap: 2px; }
    .qty .val { min-width: 44px; text-align: center; font-size: 16px; }
    .qty button { width: 32px; padding: 4px 0; }

    /* --- talent --- */
    .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .track { background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .track .t-name { display: flex; justify-content: space-between; }
    .track .t-slots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .tslot { font-size: 13px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; }
    .tslot.empty { opacity: 0.6; }
    .needs { width: 100%; border-collapse: collapse; font-size: 14px; }
    .needs th { text-align: left; font-weight: normal; color: var(--faint); font-size: 13px; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
    .needs td { padding: 8px 8px 8px 0; border-bottom: 1px dotted var(--line); vertical-align: middle; }
    .needs .short { color: #f0a15b; }
    .needs .ok { color: var(--go); }

    /* --- exhibition map --- */
    .map { width: 100%; height: auto; display: block; }
    /* keep the full map within one screen; the SVG letterboxes to fit */
    #stage .map { max-height: calc(100vh - 140px); }
    .region.in { fill: #2b251d; fill-opacity: 0.55; stroke: #4a4032; stroke-width: 1; stroke-dasharray: 5 5; }
    .region.out { fill: #14100b; fill-opacity: 0.4; stroke: #3a3226; stroke-width: 1; stroke-dasharray: 5 5; }
    .region-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; text-anchor: middle; }
    .region-label.in { fill: var(--muted); }
    .region-label.out { fill: #8a7c63; }
    .edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .edge.in.local { stroke: #5a4a30; stroke-width: 1.6; }
    .edge.in.cross { stroke: #9a7442; stroke-width: 1.8; stroke-dasharray: 8 4; opacity: 0.82; }
    .edge.out { opacity: 0.22; }
    .edge-label { font-size: 10px; fill: var(--faint); text-anchor: middle; paint-order: stroke; stroke: #1a1612; stroke-width: 3px; }
    .edge-label.in.local { fill: #9c8d72; }
    .edge-label.in.cross { fill: #d1a15b; font-size: 10px; opacity: 0.95; }
    .edge-label.out { opacity: 0.22; }
    .city.dim { opacity: 0.42; }
    .city.inactive { opacity: 0.3; }
    .city .node { fill: var(--card); stroke: var(--line-strong); stroke-width: 1.5; }
    .city .ring { fill: none; stroke-width: 2.5; opacity: 0.95; }
    .city.clickable { cursor: pointer; }
    .city.clickable .node { stroke: var(--go); }
    .city.clickable:hover .node { stroke: #7ee08a; stroke-width: 2.5; }
    .slotdot { stroke: var(--line-strong); stroke-width: 1; fill: none; }
    .slotdot.occupied { stroke: none; }
    .slotdot.locked { opacity: 0.3; stroke-dasharray: 1.8 1.4; }
    .city-name { font-size: 10.5px; fill: #d8ccb0; text-anchor: middle; }
    .city-info { font-size: 8.5px; fill: var(--faint); text-anchor: middle; }
    .badge rect { fill: #1e5c2e; stroke: var(--go); stroke-width: 1; }
    .badge text { fill: #c8f7d0; font-size: 10px; font-weight: bold; text-anchor: middle; }
    /* full map: zoom and pan */
    .map-frame { position: relative; }
    .map.zoomable { cursor: grab; touch-action: pan-y; }
    .map.zoomable.panning { cursor: grabbing; }
    .map-zoom { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; flex-direction: column; gap: 4px; }
    .map-zoom button { min-width: 36px; height: 36px; margin: 0; padding: 0 8px; font-size: 18px; background: #221d16e6; }
    .map-zoom button[aria-label="Show the whole map"] { font-size: 14px; }
    /* thumbnail: shapes only, no text */
    .thumb { cursor: zoom-in; border-radius: 6px; }
    .thumb .city-name, .thumb .city-info, .thumb .edge-label, .thumb .region-label, .thumb .badge { display: none; }
    .thumb .city .node { stroke-width: 3; }

    /* --- legend --- */
    .legend { font-size: 13px; color: #c9bb9f; line-height: 1.7; margin-top: 8px; }
    .legend .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line-strong); margin-right: 5px; vertical-align: -1px; }
    .legend .swatch.s0 { background: #c0392b; } .legend .swatch.s1 { background: #27ae60; }
    .legend .swatch.s2 { background: #2980b9; } .legend .swatch.s3 { background: #8e44ad; }

    /* --- rail --- */
    #turn-order { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
    .tchip { padding: 2px 10px; border: 1px solid #4a4032; border-radius: 999px; font-size: 13px; color: #c9bb9f; }
    .tchip.active { background: #ffd70022; border-color: var(--gold); color: var(--gold); }
    .tchip.next { border-style: dashed; }
    .tchip.me { outline: 1px solid var(--gold); outline-offset: 1px; }
    .tsep { color: var(--faint); margin: 0 3px; font-size: 12px; }
    .prow { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
    .pname { flex: 1 1 auto; }
    .pmeta { color: var(--muted); font-size: 13px; }
    .prop { border-left: 3px solid var(--line-strong); padding-left: 8px; margin: 2px 0 4px 4px; font-size: 13px; color: #c9bb9f; }
    .turn-highlight .pname { color: var(--gold); }
    .rail-head { display: flex; justify-content: space-between; align-items: baseline; }
    #log { max-height: 320px; overflow-y: auto; font-size: 13px; color: var(--muted); }
    #fallback:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>MOGUL</h1>
    <nav id="stepper" aria-label="Phases"></nav>
    <span id="status"></span>
  </header>

  <div id="views">
    <div id="view-join">
      <div class="card">
        <h3>Join the studio system</h3>
        <div class="row">
          <input id="nickname" placeholder="Nickname" />
          <button id="btn-create">Create room</button>
        </div>
        <div class="row" style="margin-top:8px">
          <input id="code" placeholder="Room code" />
          <button id="btn-join">Join room</button>
        </div>
        <div id="join-error" class="muted" style="margin-top:8px"></div>
      </div>
    </div>

    <div id="view-lobby">
      <div class="card">
        <div class="row">
          <h3 style="margin:0">Room <span id="room-code"></span></h3>
          <span class="pill" id="lobby-status"></span>
        </div>
        <div id="roster"></div>
        <div id="room-config" style="font-size: 14px; color: #a89a7f; margin-top: 8px"></div>
        <div class="row" style="margin-top:10px">
          <button id="btn-add-bot">Add bot</button>
          <button id="btn-start">Start game</button>
        </div>
      </div>
    </div>

    <div id="view-game">
      <div id="game-layout">
        <main id="stage">
          <div id="summary"></div>
          <div id="stage-body"></div>
          <div id="fallback"></div>
        </main>
        <aside id="rail">
          <div class="card">
            <b>Turn order</b>
            <div id="turn-order"></div>
          </div>
          <div class="card">
            <b>Studios</b>
            <div id="players"></div>
          </div>
          <div class="card" id="map-card">
            <div class="rail-head"><b>Map</b><button class="quiet" id="btn-map-toggle"></button></div>
            <div id="map-thumb"></div>
          </div>
          <div class="card" id="log-card">
            <b>Studio log</b>
            <div id="log"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
